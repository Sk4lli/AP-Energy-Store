# Example player YAML for the Energylink Store.
#
# The options belong under the game name "Energylink Store". If an option is
# missing, the world uses its default (5 pages, 5 locations per page, 1 MJ base
# price, 1 MJ step, 50 McGuffins, 15 % traps).

name: Tester
game: Energylink Store

Energylink Store:
  # Number of store pages (1 to 20)
  progress_pages: 5

  # Locations per page (5 to 10)
  locations_per_page: 8

  # How the pages are unlocked (page 1 is always open):
  #   page        - every further page has its own item ("Store Page 2", "Store Page 3", ...)
  #   progressive - one item for all, the first copy unlocks page 2, the second page 3, ...

  unlock_mode: page

  # Price of one location on page 1, in joules
  # Short forms are allowed: k, m, g, t -- so 750k instead of 750000
  base_price: 750k

  # Added to the price per page, in joules
  # Page 1: 750k, page 2: 2.25M, page 3: 3.75M, ...
  price_step: 1.5m

  # Shown value of a filler item, prefixes work here too (500k, 1m)
  filler_joules: 0

  # How many McGuffins are needed to win
  mcguffins_required: 50

  # Share of the filler slots that turn into traps (0 to 100)
  trap_percentage: 15

  # Tax Trap: raises every price permanently, in percent per trap
  tax_trap: true
  tax_per_trap: 10

  # Inflation Trap: burns part of the EnergyLink pool,
  # in percent of the current balance per trap
  inflation_trap: true
  inflation_per_trap: 20
