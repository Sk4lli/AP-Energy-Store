# Player-YAML Beispiel für den Energylink Store.
#
# Die Optionen gehören unter den Spielnamen "Energylink Store". Fehlen sie,
# nutzt die World ihre Standardwerte (5 Seiten, 5 Locations je Seite, 1 MJ
# Basispreis, 1 MJ Aufschlag, 50 McGuffins, 15 % Traps).

name: Tester
game: Energylink Store

Energylink Store:
  # Anzahl der Store-Seiten (1 bis 20)
  progress_pages: 5

  # Locations je Seite (5 bis 10)
  locations_per_page: 8

  # Preis einer Location auf Seite 1, in Joule
  base_price: 750000

  # Aufschlag pro Seite, in Joule
  # Seite 1: 750k, Seite 2: 2,25M, Seite 3: 3,75M, ...
  price_step: 1500000

  # Wie viele McGuffins zum Sieg nötig sind
  mcguffins_required: 50

  # Anteil der Filler-Plätze, die zu Traps werden (0 bis 100)
  trap_percentage: 15

  # Steuer-Trap: hebt alle Preise dauerhaft an, in Prozent pro Trap
  tax_trap: true
  tax_per_trap: 10

  # Inflation-Trap: verbrennt einen Teil des EnergyLink-Speichers,
  # in Prozent des aktuellen Stands pro Trap
  inflation_trap: true
  inflation_per_trap: 20
